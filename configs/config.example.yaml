approvals:
  mode: smart
  timeout: 60
  cron_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: false
  auto_approve_patterns:
    - ls
    - cat
    - head
    - tail
    - grep
    - find
    - ps
    - top
    - df
    - du
    - git status
    - git log
    - git diff
    - git show
    - git branch
  require_approval_for:
    - rm -rf
    - git push --force
    - git push -f
    - git reset --hard
    - DROP TABLE
    - DROP DATABASE
    - TRUNCATE
    - DELETE FROM
    - hermes secrets reset
    - hermes auth logout
    - systemctl stop
    - docker system prune
    - kill -9
    - mkfs
    - dd if=
  warn_on:
    - 'rm '
    - chmod 777
    - chown -R
    - apt remove
    - pip uninstall
    - npm uninstall -g
    - git commit --amend
    - git rebase
command_allowlist:
  - world/other-writable permissions
  - in-place edit of system config
  - git force push (rewrites remote history)
  - xargs with rm
  - sudo with combined-flag privilege escalation
  - hermes update (restarts gateway, kills running agents)
  - recursive chown to root
  - sudo with privilege flag (stdin/askpass/shell/list)
  - overwrite project env/config via redirection
  - recursive delete
  - kill hermes/gateway process (self-termination)
  - delete in root path
  - execute_code
  - stop/restart hermes gateway (kills running agents)
  - overwrite system file via redirection
  - SQL DROP
  - git branch force delete
  - find -delete
  - shell command via -c/-lc flag
  - chmod +x followed by immediate execution
  - overwrite project env/config file
  - script execution via heredoc
  - tirith:plain_http_to_sink
  - git reset --hard (destroys uncommitted changes)
  - docker restart/stop/kill (container lifecycle)
  - copy/move file into /etc/
  - force kill processes
  - kill process via pgrep expansion (self-termination)
  - copy/move file into system config path
  - script execution via -e/-c flag
  - stop/restart system service
  - overwrite system config
