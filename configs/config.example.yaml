# Sanitized config.yaml — replace placeholders with your actual values
# Source: /root/.hermes/config.yaml (DO NOT commit real .env)

model:
  default: MiniMax-M3
  provider: minimax-oauth
  base_url: https://api.minimax.io/anthropic
providers:
  cerebras:
    api_key: ${CEREBRAS_API_KEY}
    base_url: https://api.cerebras.ai/v1
    name: cerebras
  elevenlabs:
    api_key: ${ELEVENLABS_API_KEY}
    name: elevenlabs
  fal:
    api_key: ${FAL_KEY}
    base_url: https://queue.fal.run/
    name: fal
  featherless:
    api_key: ${FEATHERLESS_API_KEY}
    base_url: https://api.featherless.ai/v1
    name: featherless
  huggingface:
    api_key: ${HUGGINGFACE_API_KEY}
    base_url: https://router.huggingface.co/v1
    name: huggingface
  zai:
    api_key: ${ZAI_API_KEY}
    base_url: https://api.z.ai/api/paas/v4
    name: zai
  litellm:
    api: http://72.61.44.159:4000/v1
    api_key: ${LITELLM_API_KEY}
    name: litellm
  nous-portal:
    api: https://portal.nousresearch.com/v1
    api_key: ${NOUS_PORTAL_KEY}
    name: nous-portal
  sambanova:
    api_key: ${SAMBANOVA_API_KEY}
    base_url: https://api.sambanova.ai/v1
    name: sambanova
  siliconflow:
    api_key: ${SILICONFLOW_API_KEY}
    base_url: https://api.siliconflow.com/v1
    name: siliconflow
  together:
    api_key: ${TOGETHER_API_KEY}
    base_url: https://api.together.xyz/v1
    name: together
fallback_providers: []
credential_pool_strategies:
  anthropic: fill_first
  deepseek: fill_first
toolsets:
  - hermes-cli
agent:
  max_turns: 180
  gateway_timeout: 2400
  restart_drain_timeout: 60
  api_max_retries: 3
  service_tier: ''
  tool_use_enforcement: auto
  task_completion_guidance: true
  parallel_tool_call_guidance: true
  environment_probe: true
  environment_hint: ''
  coding_context: auto
  verify_on_stop: false
  gateway_timeout_warning: 900
  clarify_timeout: 600
  gateway_notify_interval: 600
  gateway_auto_continue_freshness: 3600
  image_input_mode: auto
  disabled_toolsets: []
  reasoning_effort: medium
terminal:
  backend: local
  modal_mode: auto
  cwd: /root
  timeout: 180
  daemon_term_grace_seconds: 2.0
  env_passthrough: []
  home_mode: auto
  shell_init_files: []
  auto_source_bashrc: true
  docker_image: nikolaik/python-nodejs:python3.11-nodejs20
  docker_forward_env: []
  singularity_image: docker://nikolaik/python-nodejs:python3.11-nodejs20
  modal_image: nikolaik/python-nodejs:python3.11-nodejs20
  daytona_image: nikolaik/python-nodejs:python3.11-nodejs20
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_volumes: []
  docker_mount_cwd_to_workspace: false
  docker_extra_args: []
  docker_run_as_host_user: false
  persistent_shell: true
  vercel_runtime: node24
web:
  backend: brave-free
  search_backend: brave-free
  extract_backend: exa
  use_gateway: true
browser:
  inactivity_timeout: 120
  command_timeout: 30
  record_sessions: false
  allow_private_urls: true
  engine: auto
  auto_local_for_private_urls: true
  cdp_url: ''
  dialog_policy: must_respond
  dialog_timeout_s: 300
  camofox:
    managed_persistence: true
    user_id: ''
    session_key: ''
    adopt_existing_tab: false
    rewrite_loopback_urls: false
    loopback_host_alias: host.docker.internal
  cloud_provider: browser-use
  use_gateway: true
checkpoints:
  enabled: true
  max_snapshots: 100
  max_total_size_mb: 1000
  max_file_size_mb: 20
  auto_prune: true
  retention_days: 30
  delete_orphans: true
  min_interval_hours: 12
  auto_resume: true
  auto_resume_threshold: 50
file_read_max_chars: 100000
mcp_discovery_timeout: 1.5
mcp:
  arxiv:
    args:
      - -y
      - arxiv-mcp-server@1.0.1
    command: npx
    enabled: true
    tools:
      include:
        - search
        - fetch_paper
      prompts: false
      resources: false
  atlassian:
    args:
      - -y
      - '@sooperset/mcp-atlassian'
    command: npx
    enabled: true
    env:
      CONFLUENCE_URL: ${CONFLUENCE_URL:-}
      CONFLUENCE_USERNAME: ${CONFLUENCE_USERNAME:-}
      CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:-}
      JIRA_URL: ${JIRA_URL:-}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    tools:
      include:
        - search_issues
        - get_issue
        - create_issue
        - update_issue
        - add_comment
      prompts: false
      resources: false
  cesium:
    args:
      - -y
      - '@cesium/mcp-server'
    command: npx
    enabled: false
    notes: Bridge to Cesium ion (free 5 GB tier). Provides asset query + terrain +
      imagery tools.
    tools:
      include:
        - asset_query
        - imagery_query
        - terrain_height
      prompts: false
      resources: false
  blender:
    args:
      - --from
      - blender-mcp
    command: uvx
    enabled: false
    notes: Live bridge to Blender MCP addon running on localhost:9876. See lqv-bundle
      docs.
    tools:
      include:
        - scene
        - render
        - objects
        - materials
      prompts: false
      resources: false
  brave-search:
    args:
      - -y
      - '@brave/brave-search-mcp-server@2.0.83'
    command: npx
    enabled: true
    env:
      BRAVE_API_KEY: ${BRAVE_API_KEY}
  cloudflare:
    args:
      - -y
      - '@cloudflare/mcp-server-cloudflare@0.2.0'
    command: npx
    enabled: true
    env:
      CLOUDFLARE_API_TOKEN: REPLACE_ME
    tools:
      prompts: false
      resources: false
  unreal:
    args:
      - -y
      - '@chir24/unreal-mcp'
    command: npx
    enabled: false
    notes: Bridge to UE5.7 via ChiR24/Unreal_mcp automation-bridge plugin.
    tools:
      include:
        - actor
        - level
        - blueprint
        - material
      prompts: false
      resources: false
  context7:
    args:
      - -y
      - '@upstash/context7-mcp@3.1.0'
    command: npx
  exa:
    args:
      - -y
      - exa-mcp-server@3.0.4
    command: npx
    enabled: true
  filesystem:
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem@2026.1.14'
    command: npx
    enabled: true
    tools:
      prompts: false
      resources: false
  github:
    args:
      - -y
      - '@modelcontextprotocol/server-github@2025.4.8'
    command: npx
    enabled: true
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
    tools:
      prompts: false
      resources: false
  google-drive:
    args:
      - -y
      - '@modelcontextprotocol/server-google-drive'
    command: npx
    enabled: true
    env:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
    tools:
      include:
        - list_files
        - search_files
        - read_file
        - create_file
        - update_file
        - share_file
      prompts: false
      resources: false
  memory-server:
    args:
      - -y
      - '@modelcontextprotocol/server-memory@2026.1.26'
    command: npx
    enabled: true
    tools:
      prompts: false
      resources: false
  obsidian:
    args:
      - -y
      - mcp-obsidian
    command: npx
    enabled: true
    env:
      OBSIDIAN_VAULT_PATH: ${OBSIDIAN_VAULT_PATH:-/root/obsidian-vault}
    tools:
      include:
        - read_note
        - search_notes
        - list_notes
        - create_note
        - update_note
      prompts: false
      resources: false
  postgres:
    args:
      - -y
      - '@modelcontextprotocol/server-postgres@0.6.2'
      - postgresql://postgres:***@localhost:5432/postgres
    command: npx
    enabled: true
    tools:
      include:
        - query
      prompts: false
      resources: false
  puppeteer:
    args:
      - -y
      - '@modelcontextprotocol/server-puppeteer@2025.5.12'
    command: npx
    enabled: true
    tools:
      prompts: false
      resources: false
  sequential-thinking:
    args:
      - -y
      - '@REPLACE_ME@2025.12.18'
    command: npx
    enabled: true
  slack:
    args:
      - -y
      - '@modelcontextprotocol/server-slack'
    command: npx
    enabled: true
    env:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
    tools:
      include:
        - list_channels
        - post_message
        - reply_to_thread
        - search_messages
      prompts: false
      resources: false
  stripe:
    args:
      - -y
      - '@stripe/mcp@0.7.0'
    command: npx
    enabled: true
    env:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    tools:
      prompts: false
      resources: false
  supabase:
    enabled: true
    headers:
      Authorization: Bearer sbp_68...16f0
    tools:
      prompts: false
      resources: false
    url: https://mcp.supabase.com/mcp?project_ref=qyvokpribmbrosafntqa
  himalaya-email:
    args:
      - -y
      - himalaya-mcp
    command: npx
    enabled: true
    env:
      HIMALAYA_CONFIG_PATH: ${HIMALAYA_CONFIG_PATH:-/root/.config/himalaya/config.toml}
    notes: Terminal email client — IMAP/SMTP from inside Hermes. Useful for invoices,
      client comms.
    tools:
      include:
        - list
        - read
        - send
        - search
      prompts: false
      resources: false
  onepassword:
    args:
      - -y
      - '@modelcontextprotocol/server-1password'
    command: npx
    enabled: true
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${OP_SERVICE_ACCOUNT_TOKEN:-}
    notes: 1Password secret rotation — required for hermes-ops-health pattern. No-op
      if token missing.
    tools:
      include:
        - get_secret
        - list_vaults
        - list_items
      prompts: false
      resources: false
  wikipedia:
    args:
      - -y
      - wikipedia-mcp@1.0.0
    command: npx
    enabled: true
  servers:
    hubspot:
      command: npx
      args:
        - -y
        - '@hubspot/mcp-server@0.4.0'
      enabled: false
      env:
        HUBSPOT_ACCESS_TOKEN: ${env:HUBSPOT_ACCESS_TOKEN}
        HUBSPOT_REFRESH_TOKEN: ${env:HUBSPOT_REFRESH_TOKEN}
      tools:
        include:
          - crm.objects.contacts
          - crm.objects.companies
          - crm.objects.deals
          - crm.search
          - crm.schemas
          - crm.objects.notes
          - crm.objects.tasks
        prompts: false
        resources: false
